# Meeting Scribe sans GPU (PC, Mac Apple Silicon) : docker compose -f compose.cpu.yaml up -d
# Profil rapide : small et diarisation au pas de 2,5 s, environ 0,3 × la durée de la réunion sur un
# processeur de bureau récent ; large-v3-turbo (plus précis) reste au choix dans le formulaire.
services:
  meeting-scribe:
    image: ghcr.io/lenny-ai-data/meeting-scribe:cpu
    build:
      context: .
      args:
        FLAVOR: cpu
        DEFAULT_DEVICE: cpu
        DEFAULT_MODEL: small
      secrets:
        - hf_token
    container_name: meeting-scribe
    restart: unless-stopped
    ports:
      - "8090:8000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # pour joindre Ollama ou LM Studio sur l'hôte
    volumes:
      - ./data:/data
      - ./models:/models

secrets:
  hf_token:
    environment: HF_TOKEN
