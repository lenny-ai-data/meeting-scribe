<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Scribe</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171624" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
  <script>
    function home() {
      return {
        file: null,
        url: "",
        form: { profile: "", language: "", device: "", num_speakers: "", vocabulary: "", title: "", meeting_date: "" },
        over: false,
        uploading: false,
        uploadProgress: 0,
        error: "",

        get options() { return this.sysInfo?.options || null; },

        // Profils de l'appareil choisi (modèle Whisper et pas de diarisation)
        get profiles() { return this.options?.profiles?.[this.form.device] || []; },
        get profile() { return this.profiles.find((p) => p.id === this.form.profile) || null; },

        init() {
          if (!this.options) return;
          this.form.language = this.options.default_language;
          this.form.device = this.options.default_device;
          this.deviceChanged();
        },

        deviceChanged() {
          const wanted = this.options.default_profiles?.[this.form.device];
          const usable = this.profiles.filter((p) => p.available);
          this.form.profile = (usable.find((p) => p.id === wanted) || usable[usable.length - 1] || {}).id || "";
        },

        pick(files) {
          if (files && files.length) { this.file = files[0]; this.url = ""; }
        },

        async submit() {
          this.error = "";
          if (!this.file && !this.url.trim()) { this.error = "Choisissez un fichier ou saisissez une URL."; return; }
          const fd = new FormData();
          if (this.file) fd.append("file", this.file);
          else fd.append("url", this.url.trim());
          for (const [key, value] of Object.entries(this.form)) {
            if (value !== "" && value !== null) fd.append(key, value);
          }
          this.uploading = true;
          this.uploadProgress = 0;
          try {
            const job = await uploadForm("jobs", fd, (p) => (this.uploadProgress = p));
            window.location.href = `job.html?id=${job.id}`;
          } catch (e) {
            this.error = e.message;
          } finally {
            this.uploading = false;
          }
        },
      };
    }
  </script>
  <script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="withShell(home())" x-cloak>
  <header class="top">
    <button class="menu-toggle" type="button" @click="navOpen = !navOpen" aria-label="Réunions" x-html="ICONS.menu"></button>
    <a class="brand" href="./"><img class="brand-logo" src="logo-mark.svg" alt=""><span>Meeting <span class="brand-accent">Scribe</span></span></a>
    <nav>
      <a href="./" class="active">Réunions</a>
      <a href="settings.html">Réglages</a>
      <a href="docs" target="_blank">API</a>
    </nav>
    <span class="status" :title="status.tooltip" @click="status.tooltip && toast(status.tooltip)">
      <span class="led" :class="status.state"></span><span x-text="status.text"></span>
    </span>
    <button class="theme-toggle small" type="button" onclick="cycleTheme()">Thème</button>
  </header>

  <div class="shell">
    <aside class="sidebar" :class="{ open: navOpen }">
      <a class="btn primary new" href="./">+ Nouvelle transcription</a>
      <div class="side-title">Réunions <span x-show="meetingsTotal" x-text="`(${meetingsTotal})`"></span></div>
      <p class="hint" x-show="!meetings.length" style="padding:0 8px">Aucune transcription pour l’instant.</p>
      <template x-for="m in meetings" :key="m.id">
        <a class="meeting" :class="{ current: m.id === currentId }" :href="`job.html?id=${m.id}`" :title="m.display_title">
          <span class="led sm" :class="jobLed(m.status)"></span>
          <span class="m-body">
            <span class="m-title" x-text="m.display_title"></span>
            <span class="m-meta" x-text="isActive(m.status)
              ? statusLabel(m.status) + (m.queue_position ? ` · position ${m.queue_position}` : '')
              : `${fmtDate(m.meeting_date || m.created_at)} · ${fmtDuration(m.duration)}`"></span>
            <template x-if="isActive(m.status) && m.status !== 'queued'">
              <div class="progress"><div :style="`width:${m.progress}%`"></div></div>
            </template>
          </span>
        </a>
      </template>
    </aside>
    <div class="sidebar-overlay" :class="{ open: navOpen }" @click="navOpen = false"></div>

    <main>
      <section class="card">
        <h1>Nouvelle transcription</h1>
        <div class="meta page-sub"><span>Fichier audio ou vidéo, ou lien YouTube</span></div>
        <div class="dropzone" :class="{ over }"
             @click="$refs.file.click()"
             @dragover.prevent="over = true" @dragleave.prevent="over = false"
             @drop.prevent="over = false; pick($event.dataTransfer.files)">
          <input type="file" x-ref="file" hidden accept="audio/*,video/*,.m4a,.mp4,.mp3,.wav,.webm,.ogg"
                 @change="pick($event.target.files)">
          <template x-if="!file">
            <div><strong>Déposez un enregistrement</strong> (.m4a, .mp4…) ou cliquez pour le choisir</div>
          </template>
          <template x-if="file">
            <div><strong x-text="file.name"></strong> — <span x-text="(file.size / 1048576).toFixed(1) + ' Mo'"></span>
              <button class="small" @click.stop="file = null; $refs.file.value = ''">Retirer</button></div>
          </template>
        </div>
        <div class="or">ou</div>
        <input type="url" placeholder="URL YouTube (ou autre site pris en charge par yt-dlp)" x-model="url"
               @input="if (url) file = null">

        <div class="options">
          <div class="stack">
            <div>
              <label for="f-title">Titre</label>
              <input id="f-title" type="text" placeholder="par défaut : nom du fichier" x-model="form.title">
            </div>
            <div>
              <label for="f-date">Date de la réunion</label>
              <input id="f-date" type="datetime-local" x-model="form.meeting_date">
            </div>
            <div class="grow">
              <label for="f-vocab">Vocabulaire (noms propres, sigles, jargon)</label>
              <textarea id="f-vocab" rows="3" placeholder="Ex. noms de personnes, d’entreprises ou de produits, sigles" x-model="form.vocabulary"></textarea>
            </div>
          </div>
          <div class="stack">
            <div>
              <label for="f-device">Calcul</label>
              <select id="f-device" x-model="form.device" @change="deviceChanged()">
                <template x-for="d in options?.devices || []" :key="d">
                  <option :value="d" x-text="d === 'cuda' ? 'GPU' : 'CPU'" :selected="d === form.device"></option>
                </template>
              </select>
            </div>
            <div>
              <label for="f-profile">Performance</label>
              <select id="f-profile" x-model="form.profile" :title="profile?.description || ''">
                <template x-for="p in profiles" :key="p.id">
                  <option :value="p.id" :disabled="!p.available" :selected="p.id === form.profile"
                          :title="p.reason || p.description"
                          x-text="p.available ? p.label : `${p.label} (${p.reason})`"></option>
                </template>
              </select>
              <div class="hint" x-show="profile" x-text="profile?.description" style="margin-top:4px"></div>
            </div>
            <div>
              <label for="f-lang">Langue</label>
              <select id="f-lang" x-model="form.language">
                <option value="fr">Français</option>
                <option value="en">Anglais</option>
              </select>
            </div>
            <div>
              <label for="f-speakers">Nombre d’intervenants (améliore les modes rapides)</label>
              <input id="f-speakers" type="number" min="1" max="30" placeholder="inconnu" x-model="form.num_speakers">
            </div>
          </div>
        </div>

        <div class="row" style="margin-top:20px">
          <button class="cta" @click="submit()" :disabled="uploading">Transcrire</button>
          <template x-if="uploading">
            <div class="row" style="flex:1">
              <div class="progress" style="flex:1"><div :style="`width:${uploadProgress * 100}%`"></div></div>
              <span class="hint" x-text="`Envoi ${Math.round(uploadProgress * 100)} %`"></span>
            </div>
          </template>
        </div>
        <p class="error" x-show="error" x-text="error" style="margin-top:12px"></p>
      </section>
    </main>
  </div>
</body>
</html>
