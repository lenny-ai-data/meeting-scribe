# Meeting Scribe avec GPU NVIDIA. Sans GPU : docker compose -f compose.cpu.yaml up -d
services:
  meeting-scribe:
    image: ghcr.io/lenny-ai-data/meeting-scribe:cuda
    # Construction locale (docker compose up -d --build) : le jeton HF_TOKEN du .env sert à
    # embarquer le modèle de diarisation dans l'image ; sans lui, il sera exigé à l'exécution
    build:
      context: .
      args:
        FLAVOR: cuda
      secrets:
        - hf_token
    container_name: meeting-scribe
    restart: unless-stopped
    ports:
      - "8090:8000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # pour joindre Ollama sur l'hôte
    volumes:
      - ./data:/data       # base SQLite, fichiers des jobs, config (cookies YouTube)
      - ./models:/models   # cache des modèles (Whisper, alignement)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

secrets:
  hf_token:
    environment: HF_TOKEN
