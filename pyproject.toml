[project]
name = "meeting-scribe"
version = "0.1.0"
description = "Transcription et comptes rendus de réunions (WhisperX + pyannote + LLM), pilotable par API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "tzdata",
    "yt-dlp[default]",
    "numpy>=2.1",
]

[project.optional-dependencies]
# Pile GPU, installée dans l'image Docker (`uv sync --extra gpu`)
gpu = [
    "whisperx==3.8.6",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "torchvision==0.23.*",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with"]
